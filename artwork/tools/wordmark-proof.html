<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>DroidHost wordmark proof</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  section { padding: 32px 40px; display: flex; gap: 48px; align-items: center; flex-wrap: wrap; }
  .dark { background: #0B0E14; color: #F5F7FA; }
  .light { background: #F5F7FA; color: #0B0E14; }
  figure { margin: 0; }
  figcaption { font-size: 13px; opacity: .6; margin-top: 10px; }
  img { display: block; max-height: 150px; }
</style>
</head>
<body>
<section class="dark">
  <figure><img src="../droidhost-wordmark.svg" alt="wordmark horizontal"><figcaption>横版 · 彩色（深底）</figcaption></figure>
  <figure><img src="../droidhost-wordmark-vertical.svg" alt="wordmark stacked"><figcaption>竖版 · 彩色（深底）</figcaption></figure>
</section>
<section class="light">
  <figure><img src="../droidhost-wordmark-mono.svg" alt="wordmark horizontal mono"><figcaption>横版 · 单色 currentColor（浅底默认黑）</figcaption></figure>
  <figure><img src="../droidhost-wordmark-vertical-mono.svg" alt="wordmark stacked mono"><figcaption>竖版 · 单色 currentColor（浅底默认黑）</figcaption></figure>
</section>
</body>
</html>

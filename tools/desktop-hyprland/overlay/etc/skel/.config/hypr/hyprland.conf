# Minimal Hyprland config for the DroidHost nested-render spike (Arch rolling, KGSL/zink).
# Nested under the host DroidHostWayland compositor (wayland-0); aquamarine allocates GBM
# buffers on /dev/dri/renderD0 and renders through zink/Turnip. The zink/AQ env is set by
# droiddeck-desktop, not here.
monitor = , preferred, auto, 1

env = XCURSOR_SIZE, 24

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 8
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

bind = SUPER, T, exec, alacritty
bind = SUPER, Q, killactive
bind = SUPER SHIFT, E, exit
bind = SUPER, Left, movefocus, l
bind = SUPER, Right, movefocus, r
bind = SUPER, Up, movefocus, u
bind = SUPER, Down, movefocus, d
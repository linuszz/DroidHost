name: Build Linux runtime (NixOS)

on:
  push:
    paths:
      - 'tools/nixos/**'
      - '.github/workflows/build-nixos-runtime.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish as (e.g. nixos-r1); empty = artifact only'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Nix and pin the release channel
        run: |
          set -euo pipefail
          sh <(curl -L https://nixos.org/nix/install) --no-daemon
          . "$HOME/.nix-profile/etc/profile.d/nix.sh"
          nix-channel --add https://nixos.org/channels/nixos-26.05 nixpkgs
          nix-channel --update
      - uses: actions/create-github-app-token@v2
        id: components-token
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        with:
          app-id: ${{ vars.DROIDHOST_CI_APP_ID }}
          private-key: ${{ secrets.DROIDHOST_CI_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: DroidHost-Components
      - name: Refuse a published tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.components-token.outputs.token }}
          GH_REPO: ${{ github.repository }}-Components
        run: |
          if gh release view '${{ inputs.tag }}' >/dev/null 2>&1; then
            echo "::error::${{ inputs.tag }} is already published, and published tags are never replaced: use a new tag"
            exit 1
          fi
      - name: Build
        run: |
          set -euo pipefail
          . "$HOME/.nix-profile/etc/profile.d/nix.sh"
          # The runner's user namespaces are restricted; the guest cannot sandbox either.
          export NIX_CONFIG="sandbox = false"
          tag='${{ inputs.tag }}'
          tools/nixos/build.sh out "${tag:-nixos-dev}"
      - uses: actions/upload-artifact@v4
        with:
          name: nixos-runtime
          retention-days: 7
          compression-level: 0
          path: |
            out/*.tar.zst
            out/*.sha256
            out/*.packages.txt
      - name: Publish
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.components-token.outputs.token }}
          GH_REPO: ${{ github.repository }}-Components
        run: |
          set -euo pipefail
          TAG='${{ inputs.tag }}'
          prerelease=false
          case $TAG in *-rc*) prerelease=true ;; esac
          gh release create "$TAG" --latest=false --prerelease="$prerelease" --title "$TAG" \
            --notes "NixOS 26.05 arm64 runtime for DroidHost ($GITHUB_REPOSITORY tools/nixos, $GITHUB_SHA): size $(stat -c %s "out/$TAG.tar.zst"), sha256 $(cat "out/$TAG.sha256"). The KDE Plasma desktop is baked into the closure; there is no separate desktop pack. The .packages.txt file lists the whole closure. Import it as a machine; the desktop and its markers are already in it." \
            "out/$TAG.tar.zst" "out/$TAG.sha256" "out/$TAG.packages.txt"
          gh release edit "$TAG" --latest=false --prerelease="$prerelease"

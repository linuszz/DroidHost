name: Build desktop package (Hyprland)

on:
  push:
    paths:
      - 'tools/desktop-hyprland/**'
      - '.github/workflows/build-desktop-hyprland.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish as (e.g. desktop-hyprland-r1); empty = artifact only'
        required: false
        default: ''
      runtime_packages_artifact:
        description: 'Artifact holding runtime-packages.refreshed.txt, to fit the desktop to a runtime being published'
        required: false
        default: ''
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish as; empty = artifact only'
        type: string
        default: ''
      runtime_packages_artifact:
        description: 'Artifact holding runtime-packages.refreshed.txt, to fit the desktop to a runtime being published'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.runtime_packages_artifact != ''
        with:
          name: ${{ inputs.runtime_packages_artifact }}
          path: out/runtime-base
      - name: Fit the desktop to the runtime being published
        if: inputs.runtime_packages_artifact != ''
        run: cp out/runtime-base/runtime-packages.refreshed.txt tools/desktop-hyprland/runtime-packages.txt
      - uses: actions/create-github-app-token@v2
        id: components-token
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        with:
          app-id: ${{ vars.DROIDHOST_CI_APP_ID }}
          private-key: ${{ secrets.DROIDHOST_CI_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: DroidHost-Components
      - name: Refuse a published tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.components-token.outputs.token }}
        run: |
          if gh release view '${{ inputs.tag }}' -R ${{ github.repository }}-Components >/dev/null 2>&1; then
            echo "::error::${{ inputs.tag }} is already published, and published tags are never replaced: use a new tag"
            exit 1
          fi
      - name: Build
        env:
          DROIDHOST_RELEASES: https://github.com/${{ github.repository }}-Components/releases/download
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd xz-utils gpgv gcc-14-aarch64-linux-gnu g++-14-aarch64-linux-gnu gcc-14 g++-14 cmake ninja-build libpugixml-dev pkg-config patch >/dev/null
          DESKTOP_HYPR_RELEASE_TAG='${{ inputs.tag }}' tools/desktop-hyprland/build.sh out
          echo "size $(stat -c %s out/desktop-hyprland.tar.zst) sha256 $(cat out/desktop-hyprland.sha256)"
          echo "pacman repository $(ls out/repo | wc -l) files, $(du -sm out/repo | cut -f1) MiB"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-hyprland
          retention-days: 7
          compression-level: 0
          path: |
            out/desktop-hyprland.tar.zst
            out/desktop-hyprland.packages.txt
            out/desktop-hyprland.sha256
            out/repo/
      - name: Publish
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.components-token.outputs.token }}
          GH_REPO: ${{ github.repository }}-Components
        run: |
          set -euo pipefail
          TAG='${{ inputs.tag }}'
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already published in DroidHost-Components, and published tags are never replaced: use a new tag"
            exit 1
          fi
          prerelease=false
          case $TAG in *-rc*) prerelease=true ;; esac
          gh release create "$TAG" --latest=false --prerelease="$prerelease" --title "$TAG" \
            --notes "Hyprland dynamic-tiling Wayland desktop package for DroidHost's Linux runtime ($GITHUB_REPOSITORY tools/desktop-hyprland, $GITHUB_SHA). size $(stat -c %s out/desktop-hyprland.tar.zst), sha256 $(cat out/desktop-hyprland.sha256). desktop-hyprland.packages.txt lists the signature-checked packages it was built from." \
            out/desktop-hyprland.tar.zst out/desktop-hyprland.sha256 out/desktop-hyprland.packages.txt out/repo/*
          gh release edit "$TAG" --latest=false --prerelease="$prerelease"
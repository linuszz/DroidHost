name: Build Linux runtime (Debian)

on:
  push:
    paths:
      - 'tools/debian/**'
      - '.github/workflows/build-debian-runtime.yml'
  workflow_dispatch:
    inputs:
      revision:
        description: 'Release revision, e.g. r1 (tag becomes droidhost-debian13-arm64-r1); empty = artifact only'
        required: false
        default: ''

# Cancel superseded artifact-only push builds; a dispatch publish run is never cancelled.
concurrency:
  group: debian-runtime-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  debs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build Mesa with KGSL and the patched KWin
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work debian:trixie bash tools/debian/build-debs.sh /work/out/debs
          sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v4
        with:
          name: debian-runtime-debs
          retention-days: 7
          compression-level: 0
          path: out/debs/
  rootfs:
    needs: debs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compose release tag
        id: tag
        run: |
          set -euo pipefail
          revision='${{ inputs.revision }}'
          if [ -z "$revision" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo 'Artifact-only build: no revision given.'
            exit 0
          fi
          case $revision in *[!A-Za-z0-9._-]*) echo "::error::revision may only contain letters, digits, dot, underscore, hyphen"; exit 1 ;; esac
          app=$(sed -n 's/^rootProject\.name[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' settings.gradle | tr '[:upper:]' '[:lower:]')
          [ -n "$app" ] || { echo '::error::cannot read rootProject.name from settings.gradle'; exit 1; }
          . tools/debian/base.env
          [ -n "${DEBIAN_VERSION:-}" ] || { echo '::error::DEBIAN_VERSION missing from tools/debian/base.env'; exit 1; }
          case $(uname -m) in aarch64) arch=arm64 ;; x86_64) arch=amd64 ;; *) arch=$(uname -m) ;; esac
          tag="${app}-debian${DEBIAN_VERSION}-${arch}-${revision}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"
      - uses: actions/download-artifact@v4
        with:
          name: debian-runtime-debs
          path: out/debs
      - uses: actions/create-github-app-token@v2
        id: components-token
        if: github.event_name == 'workflow_dispatch' && inputs.revision != ''
        with:
          app-id: ${{ vars.DROIDHOST_CI_APP_ID }}
          private-key: ${{ secrets.DROIDHOST_CI_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: DroidHost-Components
      - name: Refuse a published tag
        if: github.event_name == 'workflow_dispatch' && inputs.revision != ''
        env:
          GH_TOKEN: ${{ steps.components-token.outputs.token }}
        run: |
          if gh release view '${{ steps.tag.outputs.tag }}' -R ${{ github.repository }}-Components >/dev/null 2>&1; then
            echo "::error::${{ steps.tag.outputs.tag }} is already published, and published tags are never replaced: use a new revision"
            exit 1
          fi
      - name: Build
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd gpgv debootstrap debian-archive-keyring >/dev/null
          tag='${{ steps.tag.outputs.tag }}'
          export DESKTOP_BASE_URL="https://github.com/${{ github.repository }}-Components/releases/download/${tag:-debian-dev}"
          tools/debian/build.sh out/debs out "${tag:-debian-dev}"
      - uses: actions/upload-artifact@v4
        with:
          name: debian-runtime
          retention-days: 7
          compression-level: 0
          path: |
            out/*.tar.zst
            out/*.sha256
            out/*.packages.txt
      - name: Publish
        if: github.event_name == 'workflow_dispatch' && inputs.revision != ''
        env:
          GH_TOKEN: ${{ steps.components-token.outputs.token }}
          GH_REPO: ${{ github.repository }}-Components
        run: |
          set -euo pipefail
          TAG='${{ steps.tag.outputs.tag }}'
          prerelease=false
          case $TAG in *-rc*) prerelease=true ;; esac
          gh release create "$TAG" --latest=false --prerelease="$prerelease" --title "$TAG" \
            --notes "Debian 13 (trixie) arm64 runtime for DroidHost ($GITHUB_REPOSITORY tools/debian, $GITHUB_SHA): size $(stat -c %s "out/$TAG.tar.zst"), sha256 $(cat "out/$TAG.sha256"). $TAG-desktop.tar.zst is the KDE Plasma desktop built on top of it, holding only what the runtime does not already have: size $(stat -c %s "out/$TAG-desktop.tar.zst"), sha256 $(cat "out/$TAG-desktop.sha256"). The .packages.txt files list every installed package and version." \
            "out/$TAG.tar.zst" "out/$TAG.sha256" "out/$TAG.packages.txt" \
            "out/$TAG-desktop.tar.zst" "out/$TAG-desktop.sha256" "out/$TAG-desktop.packages.txt" out/debs/*.deb
          gh release edit "$TAG" --latest=false --prerelease="$prerelease"
